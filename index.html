  <script>
    let user = null;
    window.onload = () => {
      console.log('🚀 Iniciando FA Produções');
      carregarUsuario();
    };


    function loading(texto) {
      document.getElementById('overlayText').textContent = texto || 'Processando...';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('overlay').classList.add('active');
    }


    function fecharLoading() {
      document.getElementById('overlay').classList.remove('active');
    }

    function alerta(containerId, msg, tipo) {
      const classes = {
        'success': 'alert-success',
        'error': 'alert-error',
        'info': 'alert-info'
      };
      document.getElementById(containerId).innerHTML = `<div class="alert ${classes[tipo]}">${msg}</div>`;
      if (tipo !== 'error') {
        setTimeout(() => { document.getElementById(containerId).innerHTML = ''; }, 5000);
      }
    }

    function carregarUsuario() {
      google.script.run
        .withSuccessHandler(u => {
          if (u.valido) {
            user = u;
            let html = `<strong>${u.nome}</strong> | ${u.perfil}`;
            if (u.modoDev) {
              html = `⚠️ <strong>MODO DEV</strong><br>${u.email}`;
              document.getElementById('userInfo').classList.add('dev');
            }
            document.getElementById('userInfo').innerHTML = html;
            montarMenu(u);
          } else {
            document.getElementById('menu').innerHTML = `
              <div class="alert alert-error">
                <h3>🔒 Acesso Negado</h3>
                <p>${u.mensagem}</p>
                ${u.emailDetectado ? `<p style="margin-top:10px;"><strong>Email:</strong> ${u.emailDetectado}</p>` : ''}
              </div>
            `;
            document.getElementById('userInfo').innerHTML = '❌ Acesso negado';
          }
        })
        .withFailureHandler(e => {
          document.getElementById('menu').innerHTML = `<div class="alert alert-error">Erro: ${e.message}</div>`;
        })
        .obterUsuarioAtual();
    }


    function montarMenu(u) {
      const itens = [];
      itens.push({ icon: '📅', title: 'Agenda', desc: 'Visualização geral', color: 'info', fn: "abrirPagina('AgendaVisual')" });
      itens.push({ icon: '📊', title: 'Painel Financeiro', desc: 'Saúde financeira dos eventos', color: 'success', fn: "abrirPagina('PainelFinanceiro')" });

      if (u.perfil === 'Proprietário' || u.perfil === 'Sócio') {
        itens.push({ icon: '➕', title: 'Novo Evento', desc: 'Cadastrar evento, reunião ou bloqueio', color: 'primary', fn: "abrirPagina('NovoEvento')" });
        itens.push({ icon: '✏️', title: 'Editar Evento', desc: 'Alterar dados de eventos existentes', color: 'warning', fn: "abrirPagina('EditarEvento-V2')" });
      }

      if (u.perfil === 'Proprietário') {
        itens.push({ icon: '💰', title: 'Central Financeira', desc: 'Recebimentos, BV e custos', color: 'warning', fn: "abrirPagina('CentralFinanceira')" });
      }

      let html = '<div class="menu-grid">';
      itens.forEach(i => {
        html += `<div class="menu-item ${i.color}" onclick="${i.fn}">
          <div class="menu-item-icon">${i.icon}</div>
          <div class="menu-item-title">${i.title}</div>
          <div class="menu-item-desc">${i.desc}</div>
        </div>`;
      });
      html += '</div>';
      document.getElementById('menu').innerHTML = html;
    }

    // Padrão HUB SPA:
    // Cada página carregada dinamicamente DEVE expor uma função global initPagina()
    // O index é responsável apenas por carregar e inicializar
    function abrirPagina(nome) {
      loading('Carregando...');
      google.script.run
        .withSuccessHandler(html => {
          const container = document.getElementById('appContent');
          container.innerHTML = html;

          // Aguarda o DOM atualizar antes de tentar inicializar a página
          setTimeout(() => {
            if (typeof window.initPagina === 'function') {
              try {
                window.initPagina();
                console.log('✅ initPagina executado:', nome);
              } catch (e) {
                console.error('Erro ao executar initPagina:', e);
              }
            } else {
              console.warn('⚠️ Página carregada sem initPagina:', nome);
            }
          }, 0);

          fecharLoading();
        })
        .withFailureHandler(e => {
          document.getElementById('appContent').innerHTML =
            '<div class="alert alert-error">Erro ao carregar página</div>';
          fecharLoading();
        })
        .carregarPagina(nome);
    }
  </script>

      justify-content: space-between;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: radial-gradient(circle at 20% 0%, #ffe58b 0, #f5c451 35%, #f59b51 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: #141218;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 12px 30px rgba(0,0,0,0.75);
    }

    .brand-text-main {
      font-weight: 600;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .brand-text-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 0.9rem;
    }

    nav a {
      position: relative;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.7rem;
      padding-bottom: 4px;
    }

    nav a:after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width var(--transition-fast);
    }

    nav a:hover,
    nav a.active {
      color: #ffffff;
    }

    nav a.active:after {
      width: 100%;
    }

    .header-cta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-text {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .btn {
      border-radius: var(--radius-pill);
      padding: 10px 24px;
      border: 1px solid transparent;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f5c451, #f59b51);
      color: #141218;
      box-shadow: 0 16px 40px rgba(0,0,0,0.75);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.85);
    }

    .btn-outline {
      border-color: var(--border-soft);
      background: rgba(10,10,16,0.8);
      color: var(--text-main);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #fff;
    }

    .btn-sm {
      padding: 8px 18px;
      font-size: 0.7rem;
    }

    .mobile-toggle {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(10,10,16,0.9);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mobile-toggle span {
      width: 18px;
      height: 2px;
      background: #fff;
      position: relative;
      display: block;
    }

    .mobile-toggle span::before,
    .mobile-toggle span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 18px;
      height: 2px;
      background: #fff;
      transition: transform var(--transition-fast), opacity var(--transition-fast), top var(--transition-fast), bottom var(--transition-fast);
    }

    .mobile-toggle span::before {
      top: -5px;
    }

    .mobile-toggle span::after {
      bottom: -5px;
    }

    .mobile-toggle.open span {
      background: transparent;
    }

    .mobile-toggle.open span::before {
      top: 0;
      transform: rotate(45deg);
    }

    .mobile-toggle.open span::after {
      bottom: 0;
      transform: rotate(-45deg);
    }

    @media (max-width: 900px) {
      nav {
        position: fixed;
        top: var(--header-height);
        right: 12px;
        left: 12px;
        flex-direction: column;
        padding: 14px 16px 18px;
        border-radius: 18px;
        background: rgba(8,8,12,0.98);
        box-shadow: var(--shadow-soft);
        transform-origin: top;
        transform: scaleY(0.85);
        opacity: 0;
        pointer-events: none;
        gap: 14px;
      }

      nav.open {
        opacity: 1;
        pointer-events: auto;
        transform: scaleY(1);
      }

      .header-cta {
        display: none;
      }

      .mobile-toggle {
        display: inline-flex;
      }
    }

    /* Hero */

    .hero {
      min-height: 100vh;
      padding-top: calc(var(--header-height) + 40px);
      padding-bottom: 80px;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      background:
        radial-gradient(circle at 10% 0%, rgba(245,196,81,0.3), transparent 55%),
        radial-gradient(circle at 90% 10%, rgba(255,91,141,0.38), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(95,76,255,0.35), transparent 60%),
        radial-gradient(circle at 50% 30%, rgba(0,0,0,0.9), #020206);
    }

    .hero-media {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.88)), url("assets/img/event-02.jpg");
      /* Trocar por outra foto de show com público se preferir */
      background-size: cover;
      background-position: center center;
      opacity: 0.22;
      z-index: -1;
      filter: saturate(1.2);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      align-items: center;
      gap: 40px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px 4px 5px;
      border-radius: 999px;
      background: rgba(10,10,16,0.85);
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 16px;
      gap: 8px;
    }

    .hero-kicker-badge {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: radial-gradient(circle at 20% 0%, #ffe58b 0, #f5c451 40%, #f59b51 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      color: #16131f;
    }

    .hero-kicker-text {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .hero-title {
      font-size: clamp(2.8rem, 5vw, 3.6rem);
      line-height: 1.06;
      margin-bottom: 14px;
    }

    .hero-title span {
      display: block;
    }

    .hero-title-highlight {
      background: radial-gradient(circle at 10% 0%, #ffe58b, #f59b51 40%, #ff5b8d 100%);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
      max-width: 480px;
      margin-bottom: 22px;
    }

    .hero-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 26px;
    }

    .hero-pill {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(10,10,16,0.86);
      color: var(--text-muted);
    }

    .hero-pill strong {
      color: #fff;
      font-weight: 600;
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .hero-disclaimer {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .hero-disclaimer strong {
      color: #fff;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .hero-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(245,196,81,0.18);
    }

    .hero-right {
      position: relative;
    }

    .hero-card {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 26px 55px rgba(0,0,0,0.9);
      border: 1px solid rgba(255,255,255,0.14);
      background: radial-gradient(circle at 10% 0%, rgba(245,196,81,0.18), transparent 60%), #030308;
    }

    .hero-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      max-height: 520px;
    }

    .hero-card-gradient {
      position: absolute;
      inset: auto 0 0 0;
      height: 55%;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
    }

    .hero-card-content {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 2;
    }

    .hero-card-name {
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-bottom: 4px;
      color: var(--accent);
    }

    .hero-card-line {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .hero-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .hero-card-tag {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hero-floating-badge {
      position: absolute;
      right: -4px;
      top: 16px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(4,4,10,0.96);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 18px 40px rgba(0,0,0,0.9);
      font-size: 0.7rem;
    }

    .hero-floating-badge strong {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .hero-floating-badge span {
      color: var(--text-muted);
    }

    .hero-stats {
      position: absolute;
      left: -6px;
      bottom: -16px;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(4,4,10,0.96);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 18px 40px rgba(0,0,0,0.9);
      font-size: 0.7rem;
      display: flex;
      gap: 16px;
    }

    .hero-stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hero-stat-label {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.62rem;
    }

    .hero-stat-value {
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .hero {
        padding-top: calc(var(--header-height) + 16px);
      }
      .hero-grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .hero-right {
        order: -1;
      }
      .hero-card {
        max-width: 420px;
        margin: 0 auto 22px;
      }
      .hero-stats {
        left: 10px;
        bottom: -10px;
      }
      .hero-floating-badge {
        right: 10px;
      }
    }

    /* Cards / itens */

    .card {
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.08);
      background: radial-gradient(circle at 0 0, rgba(245,196,81,0.12), transparent 55%), rgba(8,8,14,0.96);
      padding: 20px 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
    }

    .card-minimal {
      background: rgba(8,8,14,0.9);
      box-shadow: 0 10px 24px rgba(0,0,0,0.7);
    }

    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .card-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .card-body {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Sobre */

    .about-highlight {
      font-weight: 500;
      color: #fff;
    }

    .about-list {
      list-style: none;
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .about-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.92rem;
    }

    .about-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      margin-top: 6px;
      flex-shrink: 0;
    }

    .about-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 22px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .about-meta strong {
      color: #fff;
    }

    .about-photo-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
    }

    .about-main-photo {
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 22px 45px rgba(0,0,0,0.9);
    }

    .about-secondary-col {
      display: grid;
      gap: 14px;
    }

    .about-secondary-photo {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 16px 40px rgba(0,0,0,0.85);
    }

    .about-ribbon {
      border-radius: 18px;
      padding: 10px 12px;
      background: rgba(6,6,14,0.96);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.76rem;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--text-muted);
    }

    .about-ribbon strong {
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.7rem;
    }

    @media (max-width: 900px) {
      .about-photo-grid {
        grid-template-columns: minmax(0,1fr);
      }
    }

    /* Show / Experiência */

    .show-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 26px;
    }

    @media (max-width: 900px) {
      .show-layout {
        grid-template-columns: minmax(0,1fr);
      }
    }

    .show-packs {
      display: grid;
      gap: 18px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .pack-title {
      font-weight: 600;
      font-size: 0.96rem;
      margin-bottom: 2px;
    }

    .pack-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .pack-list {
      list-style: none;
      display: grid;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .pack-list li::before {
      content: "• ";
      color: var(--accent);
    }

    .show-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .show-media {
      display: grid;
      gap: 16px;
    }

    .show-photo-main {
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 22px 45px rgba(0,0,0,0.95);
    }

    .show-photo-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .show-photo-small {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.85);
    }

    /* Agenda */

    .agenda-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    @media (max-width: 900px) {
      .agenda-grid {
        grid-template-columns: minmax(0,1fr);
      }
    }

    .agenda-card {
      position: relative;
      padding: 18px 18px 20px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      background: radial-gradient(circle at 0 0, rgba(245,196,81,0.18), transparent 55%), rgba(8,8,14,0.96);
      box-shadow: 0 12px 30px rgba(0,0,0,0.85);
      font-size: 0.86rem;
    }

    .agenda-date {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .agenda-city {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .agenda-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .agenda-type {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .agenda-status {
      position: absolute;
      right: 14px;
      top: 14px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(4,4,10,0.95);
    }

    .agenda-status--open {
      border-color: var(--accent);
    }

    /* Galeria */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 10px;
    }

    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast), filter var(--transition-fast);
    }

    .gallery-item.large {
      grid-row: span 2;
      grid-column: span 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.95);
      border-color: var(--accent);
      filter: saturate(1.2);
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    /* Vídeos */

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    @media (max-width: 900px) {
      .videos-grid {
        grid-template-columns: minmax(0,1fr);
      }
    }

    .video-card {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(8,8,14,0.98);
      box-shadow: 0 16px 40px rgba(0,0,0,0.9);
    }

    .video-frame {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-info {
      padding: 12px 14px 14px;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .video-title {
      font-weight: 500;
      color: #fff;
      margin-bottom: 4px;
    }

    /* Depoimentos */

    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    @media (max-width: 900px) {
      .testimonials-grid {
        grid-template-columns: minmax(0,1fr);
      }
    }

    .testimonial {
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(8,8,14,0.98);
      padding: 18px 18px 20px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.9);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .testimonial-quote {
      margin-bottom: 12px;
    }

    .testimonial-name {
      font-weight: 500;
      color: #fff;
      font-size: 0.9rem;
    }

    .testimonial-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Cerimonialistas */

    .producers-layout {
      display: grid;
      grid-template-columns: minmax(0,1.2fr) minmax(0,0.8fr);
      gap: 26px;
    }

    @media (max-width: 900px) {
      .producers-layout {
        grid-template-columns: minmax(0,1fr);
      }
    }

    .producers-list {
      list-style: none;

      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    [data-reveal].visible {

      transform: translateY(0);

    // Header scroll state
    const header = document.getElementById('site-header');
    const navLinks = Array.from(document.querySelectorAll('#main-nav a'));
    const mobileToggle = document.getElementById('mobile-toggle');
    const mainNav = document.getElementById('main-nav');

    function onScroll() {
      if (window.scrollY > 40) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }

      // Atualiza link ativo do menu
      const sections = ['inicio','sobre','show','agenda','midia','depoimentos','cerimonialistas','contato'];
      let currentId = 'inicio';

      for (const id of sections) {
        const section = document.getElementById(id);
        if (section) {
          const rect = section.getBoundingClientRect();
          if (rect.top <= window.innerHeight * 0.3 && rect.bottom >= window.innerHeight * 0.3) {
            currentId = id;
            break;
          }
        }
      }

      navLinks.forEach(link => {
        if (link.getAttribute('href') === '#' + currentId) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    window.addEventListener('scroll', onScroll);
    onScroll();

    // Mobile menu
    mobileToggle.addEventListener('click', () => {
      const open = mainNav.classList.toggle('open');
      mobileToggle.classList.toggle('open', open);
    });

    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        mainNav.classList.remove('open');
        mobileToggle.classList.remove('open');
      });
    });

    // Smooth scroll (para navegadores que não suportam nativamente)
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        const targetId = this.getAttribute('href').substring(1);
        const target = document.getElementById(targetId);
        if (target) {
          e.preventDefault();
          const top = target.getBoundingClientRect().top + window.scrollY - 80;
          window.scrollTo({ top, behavior: 'smooth' });
        }
      });
    });

    // Reveal animation
    const revealEls = document.querySelectorAll('[data-reveal]');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.18 });

    revealEls.forEach(el => observer.observe(el));

    // Ano atual no rodapé
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
